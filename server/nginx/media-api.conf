# Include this file inside each portfolio server {} block.

client_max_body_size 100m;
client_body_timeout 120s;

location = /api/media {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/andkiv-api/media.php;
    fastcgi_param MEDIA_CONFIG_PATH /etc/andkiv/media.php;
    fastcgi_pass unix:/run/php/php8.1-fpm-andkiv-media.sock;

    # Lets PHP receive large video uploads progressively instead of forcing
    # Nginx to buffer the whole request in memory first.
    fastcgi_request_buffering off;
    fastcgi_read_timeout 120s;
}

location ^~ /media/ {
    alias /var/www/andkiv-media/;
    autoindex off;
    access_log off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}
