; Dedicated on-demand PHP-FPM pool for the media endpoint.
; Copy to /etc/php/8.1/fpm/pool.d/andkiv-media.conf.
[andkiv-media]
user = www-data
group = www-data

listen = /run/php/php8.1-fpm-andkiv-media.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 10s
pm.max_requests = 250

php_admin_flag[expose_php] = off
